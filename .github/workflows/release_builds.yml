name: ICP - Release Builds

# Packaging, not verification.
#
# An APK and an MSI answer "what do we hand someone?", not "is this commit
# good?". They used to sit in build_apps.yml behind `if: workflow_dispatch`,
# which meant every pull request listed two `skipped` checks — a shape that
# reads like a failure even though nothing had gone wrong. Worse, they sat in
# the same workflow as the gate, so the gate's meaning ("every job here
# passed, therefore the commit is good") had to be qualified by hand.
#
# Cut a release build from the Actions tab → this workflow → Run workflow, on
# the branch you want to ship.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK
        working-directory: mobile_app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Desktop (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 18 is EOL (no security patches since Apr 2025); track active LTS.
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-app
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
