<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ICP Admin</title>
  <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32x32.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body { background: #0f172a; margin: 0; overflow: hidden; }

    .hub-wrap {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 0;
      background: #0f172a;
      transition: opacity 0.4s ease;
    }
    .hub-wrap.fade-out { opacity: 0; pointer-events: none; }

    .hub-brand {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 32px;
    }
    .hub-logo {
      font-size: 2rem; font-weight: 700;
      color: #f1f5f9; letter-spacing: 0.01em; line-height: 1;
    }
    .hub-logo .i-blue { color: #2563eb; }
    .hub-brand-text { display: flex; flex-direction: column; justify-content: center; }
    .hub-brand-title {
      font-size: 1.1rem; font-weight: 700;
      color: #f1f5f9; letter-spacing: 0.02em; line-height: 1.2;
    }
    .hub-brand-sub {
      font-size: 0.68rem; font-weight: 600; color: #f59e0b;
      text-transform: uppercase; letter-spacing: 0.12em;
    }

    .loader-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(37,99,235,0.12);
      border-left-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hub-bar-track {
      width: 200px; height: 3px;
      background: rgba(255,255,255,0.07);
      border-radius: 99px; overflow: hidden;
      margin-top: 14px;
    }
    .hub-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      border-radius: 99px;
      transition: width 0.25s ease;
    }
    .hub-status {
      color: #64748b; font-size: 0.68rem;
      font-weight: 500; letter-spacing: 0.06em;
      text-transform: uppercase; margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="hub-wrap" id="hub">
    <div class="hub-brand">
      <div class="hub-logo"><span class="i-blue">I</span>CP</div>
      <div class="hub-brand-text">
        <span class="hub-brand-title">Interview Coach Prep</span>
        <span class="hub-brand-sub">Admin Portal</span>
      </div>
    </div>

    <div class="loader-spinner"></div>
    <div class="hub-bar-track"><div class="hub-bar" id="hub-bar"></div></div>
    <div class="hub-status" id="hub-status">Initialising...</div>
  </div>

  <script src="/static/js/app.js?v=1.8"></script>

  <script>
    (function () {
      const bar    = document.getElementById('hub-bar');
      const status = document.getElementById('hub-status');
      const hub    = document.getElementById('hub');

      // 3-stage fill: 30% → 65% → 100%, then prompt
      bar.style.width    = '30%';
      status.textContent = 'Initialising...';

      setTimeout(function () {
        bar.style.width    = '65%';
        status.textContent = 'Loading resources...';
      }, 600);

      setTimeout(function () {
        bar.style.width    = '100%';
        status.textContent = 'Ready.';
      }, 1300);

      setTimeout(function () {
        hub.classList.add('fade-out');
        setTimeout(function () {
          if (typeof window.showPassphrasePrompt === 'function') {
            window.showPassphrasePrompt();
          } else {
            window.location.replace(
              atob('L3N0YXRpYy9wYWdlcy9pY3AtYWRtaW4tYXV0aC05ZjJkOGI0ZS5odG1s')
            );
          }
        }, 400);
      }, 1800);
    })();
  </script>

</body>
</html>
