<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in...</title>
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico?v=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=1.4">
</head>
<body class="oauth-callback-body">
  <div class="text-center">
    <div class="loader-spinner mx-auto mb-3"></div>
    <p class="text-secondary small text-uppercase loader-text">Signing you in...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/static/js/app.min.js?v=2.0"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const oauthError = params.get('oauth_error');

      if (oauthError) {
        Swal.fire({
          icon: 'error',
          title: 'Login Failed',
          text: decodeURIComponent(oauthError.replace(/\+/g, ' ')),
          confirmButtonText: 'Back to Login',
          confirmButtonColor: '#6366f1',
        }).then(() => {
          window.location.replace('/static/pages/login.html');
        });
        return;
      }

      if (!token) {
        window.location.replace('/static/pages/login.html');
        return;
      }

      // Store token via the same mechanism as normal login
      if (window.icp && window.icp.state) {
        window.icp.state.setToken(token);
      } else {
        localStorage.setItem('token', token);
        sessionStorage.setItem('icp_just_logged_in', '1');
      }

      // Show success toast then redirect to dashboard
      Swal.fire({
        icon: 'success',
        title: 'Login Successful!',
        text: 'Redirecting you to your dashboard...',
        timer: 2000,
        timerProgressBar: true,
        showConfirmButton: false,
        allowOutsideClick: false,
        background: '#1e293b',
        color: '#f1f5f9',
        iconColor: '#22c55e',
      }).then(() => {
        window.location.replace('/static/pages/dashboard.html');
      });
    })();
  </script>
</body>
</html>
