<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in...</title>
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico?v=1">
  <style>
    html, body { margin: 0; padding: 0; background: #0f172a; }
  </style>
</head>
<body>
  <!-- Suppress offline detector before app.min.js runs -->
  <script> window.ICP_NO_OFFLINE = true; </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/static/js/app.min.js?v=2.0"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const oauthError = params.get('oauth_error');

      if (oauthError) {
        Swal.fire({
          icon: 'error',
          title: 'Login Failed',
          text: decodeURIComponent(oauthError.replace(/\+/g, ' ')),
          confirmButtonText: 'Back to Login',
          confirmButtonColor: '#6366f1',
          background: '#1e293b',
          color: '#f1f5f9',
        }).then(() => {
          window.location.replace('/static/pages/login.html');
        });
        return;
      }

      if (!token) {
        window.location.replace('/static/pages/login.html');
        return;
      }

      // Use setToken() so stale resume/feedback data is properly cleared
      if (window.icp && window.icp.state) {
        window.icp.state.setToken(token);
      } else {
        localStorage.setItem('token', token);
        sessionStorage.setItem('icp_just_logged_in', '1');
      }

      // Stage 1 — Signing in loader
      Swal.fire({
        title: 'Signing in...',
        text: 'Please wait while we verify your account',
        allowOutsideClick: false,
        showConfirmButton: false,
        background: '#1e293b',
        color: '#f1f5f9',
        didOpen: () => { Swal.showLoading(); }
      });

      // Stage 2 — Success then redirect
      setTimeout(() => {
        Swal.fire({
          icon: 'success',
          title: 'Login Successful!',
          text: 'Redirecting you to your dashboard...',
          timer: 2000,
          timerProgressBar: true,
          showConfirmButton: false,
          allowOutsideClick: false,
          background: '#1e293b',
          color: '#f1f5f9',
          iconColor: '#22c55e',
        }).then(() => {
          window.location.replace('/static/pages/dashboard.html');
        });
      }, 800);
    })();
  </script>
</body>
</html>
