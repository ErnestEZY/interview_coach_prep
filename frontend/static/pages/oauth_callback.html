<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in...</title>
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico?v=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0f172a;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .signin-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      animation: fadeInUp 0.5s ease;
    }

    .dots {
      display: flex;
      gap: 0.6rem;
    }

    .dots span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(1) { background: #6366f1; }
    .dots span:nth-child(2) { background: #8b5cf6; animation-delay: 0.2s; }
    .dots span:nth-child(3) { background: #a78bfa; animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0);    opacity: 0.6; }
      40%           { transform: translateY(-12px); opacity: 1;   }
    }

    .signin-label {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f1f5f9;
      font-family: sans-serif;
      letter-spacing: 0.02em;
    }

    .signin-sub {
      font-size: 0.8rem;
      color: #94a3b8;
      font-family: sans-serif;
      letter-spacing: 0.03em;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
  </style>
</head>
<body>

  <div class="signin-card">
    <div class="dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <p class="signin-label">Signing in...</p>
    <p class="signin-sub">Please wait while we verify your account</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/static/js/app.min.js?v=2.0"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const oauthError = params.get('oauth_error');

      if (oauthError) {
        Swal.fire({
          icon: 'error',
          title: 'Login Failed',
          text: decodeURIComponent(oauthError.replace(/\+/g, ' ')),
          confirmButtonText: 'Back to Login',
          confirmButtonColor: '#6366f1',
        }).then(() => {
          window.location.replace('/static/pages/login.html');
        });
        return;
      }

      if (!token) {
        window.location.replace('/static/pages/login.html');
        return;
      }

      // Store token via the same mechanism as normal login
      if (window.icp && window.icp.state) {
        window.icp.state.setToken(token);
      } else {
        localStorage.setItem('token', token);
        sessionStorage.setItem('icp_just_logged_in', '1');
      }

      // Show success toast then redirect to dashboard
      Swal.fire({
        icon: 'success',
        title: 'Login Successful!',
        text: 'Redirecting you to your dashboard...',
        timer: 2000,
        timerProgressBar: true,
        showConfirmButton: false,
        allowOutsideClick: false,
        background: '#1e293b',
        color: '#f1f5f9',
        iconColor: '#22c55e',
      }).then(() => {
        window.location.replace('/static/pages/dashboard.html');
      });
    })();
  </script>
</body>
</html>
