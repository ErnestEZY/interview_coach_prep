<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Required</title>
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico?v=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=1.4">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="auth-page">
  <script src="/static/js/app.min.js?v=2.0"></script>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="auth-card p-4 p-md-5 animate-fade-in text-center">
          <div class="mb-4">
            <i class="bi bi-envelope-exclamation text-warning" style="font-size:2.5rem;"></i>
          </div>
          <h4 class="fw-bold mb-2">Email Address Required</h4>
          <p class="text-secondary small mb-4">
            Your GitHub account does not have a public email address. Please enter your email below to complete sign-in.
          </p>
          <input id="emailInput" type="email" class="form-control mb-3" placeholder="your@email.com" maxlength="100">
          <button id="continueBtn" class="btn btn-primary w-100 fw-bold" onclick="submitEmail()">Continue</button>
          <a href="/static/pages/login.html" class="d-block mt-3 text-secondary small">Back to Login</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function submitEmail() {
      const email = document.getElementById('emailInput').value.trim();
      if (!email || !email.includes('@')) {
        Swal.fire({ icon: 'warning', title: 'Invalid Email', text: 'Please enter a valid email address.', confirmButtonColor: '#8b5cf6' });
        return;
      }
      const btn = document.getElementById('continueBtn');
      btn.disabled = true;
      btn.textContent = 'Please wait...';

      try {
        const res = await axios.post('/api/auth/oauth/github/email', { email });
        const token = res.data.access_token;
        if (window.icp && window.icp.state) {
          window.icp.state.setToken(token);
        } else {
          localStorage.setItem('token', token);
        }
        window.location.replace('/static/pages/dashboard.html');
      } catch (err) {
        const msg = err.response?.data?.detail || 'Something went wrong. Please try again.';
        Swal.fire({ icon: 'error', title: 'Error', text: msg, confirmButtonColor: '#8b5cf6' });
        btn.disabled = false;
        btn.textContent = 'Continue';
      }
    }

    document.getElementById('emailInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitEmail();
    });
  </script>
</body>
</html>
