<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Prevent bfcache from restoring stale admin session state -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png?v=1">
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico?v=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32x32.png?v=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <link rel="stylesheet" href="/static/css/styles.min.css?v=1.4">
  <style>
    [v-cloak] { display: none !important; }
  </style>
</head>
<body class="auth-page">
  <!-- Scripts at start of body for faster execution -->
  <!-- Clear any stale session data FIRST, before loading app.js (which initializes icpState from localStorage) -->
  <script>
    (function() {
      try {
        // Wipe ALL localStorage and sessionStorage before app.js loads.
        // This prevents stale admin tokens or session flags from bleeding
        // into the normal user login flow (e.g. after navigating back from admin portal).
        const keys = Object.keys(localStorage);
        keys.forEach(function(k) { if (k !== 'startup_id') localStorage.removeItem(k); });
        sessionStorage.clear();
      } catch(_) {}
    })();

    // If this page is restored from the bfcache (back/forward navigation),
    // force a full reload so the inline clear script above actually runs fresh.
    window.addEventListener('pageshow', function(e) {
      if (e.persisted) {
        window.location.reload();
      }
    });
  </script>
  <script src="/static/js/app.min.js?v=2.0"></script>

  <div id="app" v-cloak>
    <nav class="navbar navbar-dark glass-nav">
      <div class="container d-flex align-items-center">
        <div class="d-flex align-items-center gap-3">
          <a class="navbar-brand fw-bold fs-4 mb-0 me-0" href="/">
            <span class="text-primary">I</span>CP
          </a>
          <a class="btn btn-outline-light btn-sm px-3" href="/static/pages/register.html">Register</a>
        </div>
      </div>
    </nav>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="auth-card p-4 p-md-5 animate-fade-in">
            <h2 class="auth-header mb-4">Welcome Back</h2>
            <form @submit.prevent="login">
              <div class="mb-4">
                <label class="form-label text-secondary small text-uppercase fw-bold">Email Address <span class="text-danger">*</span></label>
                <input v-model="username" type="email" name="email" autocomplete="email" class="form-control form-control-lg" required placeholder="name@example.com" maxlength="50">
              </div>
              <div class="mb-4">
                <label class="form-label text-secondary small text-uppercase fw-bold">Password <span class="text-danger">*</span></label>
                <div class="input-group input-group-lg">
                  <input v-model="password" name="password" autocomplete="current-password" :type="showPassword ? 'text' : 'password'" class="form-control" required placeholder="Enter your password" maxlength="16">
                  <button class="btn password-toggle-btn" type="button" @click="showPassword = !showPassword" title="Toggle password visibility">
                    <i class="bi" :class="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                  </button>
                </div>
                <div class="mt-2 text-end">
                  <a href="/static/pages/forgot_password.html" class="text-primary text-decoration-none small fw-bold">Forgot Password?</a>
                </div>
              </div>
              <div class="position-relative">
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" :disabled="loading" :class="{'opacity-50': !username || !password}">
                  {{ loading ? 'Signing In...' : 'Sign In' }}
                </button>
                <div v-if="!username || !password" class="btn-overlay-trigger" @click="promptFields"></div>
              </div>

              <!-- OAuth Divider -->
              <div class="d-flex align-items-center gap-2 my-3">
                <hr class="flex-grow-1 border-secondary opacity-25">
                <span class="text-secondary small">or continue with</span>
                <hr class="flex-grow-1 border-secondary opacity-25">
              </div>

              <!-- OAuth Buttons -->
              <div class="d-flex gap-2">
                <a href="/api/auth/oauth/google" class="btn btn-outline-light w-50 d-flex align-items-center justify-content-center gap-2 py-2">
                  <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.1 0 5.9 1.1 8.1 2.9l6-6C34.4 3.5 29.5 1.5 24 1.5 14.9 1.5 7.1 7 3.4 14.8l7 5.4C12.2 14 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.7C43.7 36.7 46.5 30.8 46.5 24z"/><path fill="#FBBC05" d="M10.4 28.4A14.5 14.5 0 0 1 9.5 24c0-1.5.3-3 .9-4.4l-7-5.4A22.5 22.5 0 0 0 1.5 24c0 3.6.9 7 2.5 10l6.4-5.6z"/><path fill="#34A853" d="M24 46.5c5.5 0 10.1-1.8 13.5-4.9l-7.4-5.7c-1.9 1.3-4.3 2-6.1 2-6.4 0-11.8-4.5-13.6-10.5l-7 5.4C7.1 41 14.9 46.5 24 46.5z"/></svg>
                  <span class="small fw-semibold">Google</span>
                </a>
                <a href="/api/auth/oauth/github" class="btn btn-outline-light w-50 d-flex align-items-center justify-content-center gap-2 py-2">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.38.6.1.82-.26.82-.58v-2.03c-3.34.72-4.04-1.61-4.04-1.61-.54-1.38-1.33-1.74-1.33-1.74-1.09-.74.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.17 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02.005 2.04.14 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.66 1.65.25 2.87.12 3.17.77.84 1.24 1.91 1.24 3.22 0 4.61-2.8 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57C20.56 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>
                  <span class="small fw-semibold">GitHub</span>
                </a>
              </div>

              <div class="mt-4 text-center">
                <span class="text-secondary small">Don't have an account?</span>
                <a href="/static/pages/register.html" class="auth-footer-link text-primary text-decoration-none fw-bold ms-1">Create Account</a>
              </div>
            </form>

            <!-- Legal Links at the bottom of the card with different background -->
            <div class="mt-3 pt-2 border-top border-secondary border-opacity-10 text-center bg-light bg-opacity-10 rounded-bottom py-3 px-3 mx-n4 mb-n4">
              <p class="text-secondary small mb-0 legal-footer-text">
                By continuing, you agree to ICP's<br>
                <a href="#" class="text-primary text-decoration-none fw-bold" @click.prevent="showTerms">Terms &amp; Conditions</a>
                &nbsp;&amp;&nbsp;
                <a href="#" class="text-primary text-decoration-none fw-bold" @click.prevent="showPrivacy">Privacy Policy</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
