[pytest]
# E2E tests are opt-in — run with: pytest tests/e2e/ --browser chromium
# Unit/integration tests run by default without browser
markers =
    e2e: End-to-end browser tests (requires running backend + Playwright)
    needs_system_server: System tests that need the live app at SYSTEM_BASE_URL
    writes_db: System tests that write to the database (only against a throwaway DB)
    vrt: Pixel baselines, compared only on the host that recorded them (no CI)

# Ignore e2e by default in normal test runs
addopts = --ignore=tests/e2e

# Per-test ceiling (seconds) — no single test may hang a suite run.
# Playwright ops default to 30s; 120s is the generous outer bound.
timeout = 120
